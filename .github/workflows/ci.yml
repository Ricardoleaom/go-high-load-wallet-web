name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The generated client must match the contract it was generated from.
      - run: npm run check:api

  loadlab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loadlab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: loadlab/go.sum
      - run: go vet ./...
      - run: gofmt -l . | (! grep .)
      - run: go test -race -count=1 ./...
      - run: go build ./...
