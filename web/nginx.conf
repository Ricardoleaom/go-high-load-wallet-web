# Serves the built single-page app: every path that isn't a real file
# falls back to index.html, so client-side routing (react-router) owns
# navigation; hashed assets are cached hard, index.html is not.
#
# nginx's add_header does not inherit into a location block that sets
# its own add_header, so the security headers are repeated in both
# location blocks below rather than declared once at the server level.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Defense in depth for a console that signs operators in and reads
    # financial data. connect-src names the backend, the load lab and
    # Keycloak this Compose file publishes; style-src allows inline
    # styles because Recharts sets them on chart elements directly.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080 http://localhost:8090 http://localhost:8081; frame-ancestors 'none'";

    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
